# On merge to main: semver tag from commit prefixes (AGENTS.md), then GitHub Release
# with grouped notes and GoReleaser artifacts in the same workflow.
#
# Tag push uses GITHUB_TOKEN, which does NOT trigger other workflows (see
# https://docs.github.com/en/actions/using-workflows/triggering-a-workflow).
name: Release on merge

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  tag:
    name: Tag next version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    outputs:
      should_tag: ${{ steps.version.outputs.should_tag }}
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          result="$(bash .github/scripts/compute-next-version.sh)"
          if echo "$result" | grep -q '^skip='; then
            echo "$result" | grep '^skip=' | sed 's/^skip=//'
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$result"
          next="$(echo "$result" | awk -F= '/^next=/ { print $2 }')"
          bump="$(echo "$result" | awk -F= '/^bump=/ { print $2 }')"
          previous="$(echo "$result" | awk -F= '/^previous=/ { print $2 }')"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "should_tag=true" >> "$GITHUB_OUTPUT"

      - name: Preview release notes
        if: steps.version.outputs.should_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash .github/scripts/generate-release-notes.sh "$TAG" "$PREVIOUS"

      - name: Create and push tag
        if: steps.version.outputs.should_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (${{ steps.version.outputs.bump }} bump)"
          git push origin "$TAG"

  release:
    name: Publish GitHub release (GoReleaser)
    needs: tag
    if: needs.tag.outputs.should_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}

      - name: Generate release notes
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          PREVIOUS: ${{ needs.tag.outputs.previous }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash .github/scripts/generate-release-notes.sh "$TAG" "$PREVIOUS" > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          args: release --clean --release-notes-file=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
